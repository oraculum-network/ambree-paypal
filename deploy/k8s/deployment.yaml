# One small Node pod: the chat page, the operator page, the two PayPal webhook endpoints and MCP. The
# bookings and the ledger live in sqlite at DB_PATH on the PVC paypal-data (mounted at /data, the
# only writable path; the root filesystem is read-only). The label app.kubernetes.io/name:
# ambree-paypal is what NetworkPolicies can select (in from the ingress controller on :8080, out to
# DNS and public :443). Prerequisites, made by the cluster admin, never from here: namespace `paypal`,
# PVC `paypal-data`, PriorityClass `paypal-low`, Secret `paypal-secrets`; see DEPLOY.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paypal-web
  labels:
    app.kubernetes.io/name: ambree-paypal
    app.kubernetes.io/component: web
spec:
  replicas: 1 # sqlite has one writer, and conversations are in memory: one replica only
  revisionHistoryLimit: 3
  strategy:
    type: Recreate # never two pods on one sqlite file (and the RWO PVC)
  selector:
    matchLabels:
      app.kubernetes.io/name: ambree-paypal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ambree-paypal
        app.kubernetes.io/component: web
    spec:
      priorityClassName: paypal-low
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # The volume must be writable by uid 1000 (the image's `node` user).
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paypal-data
        - name: tmp # SQLite's temp files (large sorts, VACUUM): the root filesystem is read-only
          emptyDir: { sizeLimit: 16Mi }
      containers:
        - name: web
          # Built into the node's container runtime (hence Never; with a registry, change it in an
          # overlay); the tag is the 7-char commit sha, set by an overlay at deploy time (DEPLOY.md
          # steps 4 and 5).
          image: oraculum/ambree-paypal
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          # PAYPAL_OPERATOR_IDENTITY is deliberately unset: the default ("paypal") confirms with PayPal
          # at startup who owns each REST app (the payee echo of a probe order that is never approved,
          # DESIGN.md §21): the operator's app must be PAYPAL_OPERATOR_MERCHANT_ID's, the guide's app
          # PAYPAL_GUIDE_PAYEE_MERCHANT_ID's; otherwise the pod refuses to start, naming the check.
          # PAYPAL_BASE_URL is unset too: the sandbox (the app refuses any live PayPal URL).
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: PUBLIC_URL
              value: https://paypal.ambree.ai
            - name: DB_PATH
              value: /data/ambree.sqlite
            # Merchant ids are not secrets. Both are required in sandbox mode, must differ, and are
            # 8-20 capital letters and digits; empty, the pod refuses to start (fails closed). These
            # are the hosted demo's sandbox accounts, read off the developer dashboard on 3 Nov.
            - name: PAYPAL_GUIDE_PAYEE_MERCHANT_ID # the sandbox business account that plays every guide (DE, EUR)
              value: DF39WHJKDE862
            - name: PAYPAL_OPERATOR_MERCHANT_ID # the REST app owner's own account (MU): never a payee
              value: LG3KJ8XHUA4DW
            # OpenAI-compatible; the app calls ${LLM_BASE_URL}/chat/completions.
            - name: LLM_BASE_URL
              value: https://openrouter.ai/api/v1
            - name: LLM_MODEL # free on OpenRouter; tool calling checked on the hosted demo 3 Nov
              value: nvidia/nemotron-3-ultra-550b-a55b:free
            # Secret paypal-secrets (created by hand, DEPLOY.md step 3). Every key is required, so a
            # missing Secret or key stops the pod at CreateContainerConfigError. PAYPAL_WEBHOOK_ID,
            # PAYPAL_GUIDE_WEBHOOK_ID and MCP_DEMO_PASSCODE may hold an empty value: no webhook id = its
            # endpoint answers 503; no passcode = /mcp answers 401.
            # The operator's REST app: orders and captures; its webhook -> /webhooks/paypal.
            - name: PAYPAL_CLIENT_ID
              valueFrom: { secretKeyRef: { name: paypal-secrets, key: PAYPAL_CLIENT_ID } }
            - name: PAYPAL_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: paypal-secrets, key: PAYPAL_CLIENT_SECRET } }
            - name: PAYPAL_WEBHOOK_ID
              valueFrom: { secretKeyRef: { name: paypal-secrets, key: PAYPAL_WEBHOOK_ID } }
            # The guide's own REST app (owned by the guide's sandbox account): the refunds, which PayPal
            # refuses to the operator's app (DESIGN.md §21); its webhook -> /webhooks/paypal/guide.
            - name: PAYPAL_GUIDE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: paypal-secrets, key: PAYPAL_GUIDE_CLIENT_ID } }
            - name: PAYPAL_GUIDE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: paypal-secrets, key: PAYPAL_GUIDE_CLIENT_SECRET } }
            - name: PAYPAL_GUIDE_WEBHOOK_ID
              valueFrom: { secretKeyRef: { name: paypal-secrets, key: PAYPAL_GUIDE_WEBHOOK_ID } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: paypal-secrets, key: LLM_API_KEY } }
            - name: MCP_DEMO_PASSCODE
              valueFrom: { secretKeyRef: { name: paypal-secrets, key: MCP_DEMO_PASSCODE } }
          volumeMounts:
            - name: data
              mountPath: /data # the directory of DB_PATH (sqlite also writes its -wal/-shm files here)
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          # Small on purpose: fits a LimitRange of 500m / 256Mi per container, if the cluster admin
          # sets one (more memory needs that raised first).
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # The server listens only after the identity checks passed, so /healthz answering means the
          # config loaded, sqlite opened DB_PATH and PayPal confirmed both apps' owners.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
