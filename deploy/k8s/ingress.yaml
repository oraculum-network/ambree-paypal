# https://paypal.ambree.ai: HTTPS only (websecure), its own Let's Encrypt certificate from
# Traefik's `le` certificate resolver. No `tls:` stanza: Traefik's router.tls annotation turns TLS
# on and the resolver supplies the certificate. Change the host and the resolver for your cluster.
#
# ORDER: the A record for the host (DNS-only) must resolve publicly BEFORE the first apply:
# Traefik tries a certificate once and doesn't retry a failed one on its own (DEPLOY.md step 1).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paypal-web
  labels:
    app.kubernetes.io/name: ambree-paypal
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
spec:
  ingressClassName: traefik
  rules:
    - host: paypal.ambree.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paypal-web
                port:
                  name: http
