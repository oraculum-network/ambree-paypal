# https://paypal.ambree.ai: HTTPS only (websecure), its own Let's Encrypt certificate from
# Traefik's `le` resolver. The same annotations as qloo.ambree.ai and every Ingress on
# oraculum-prod; like them, no `tls:` stanza: Traefik's router.tls annotation turns TLS on and
# the resolver supplies the certificate. The deploy gate admits the host (INGRESS_HOST_RE:
# any subdomain of ambree.ai).
#
# ORDER: the A record paypal.ambree.ai -> 130.61.238.6 (Cloudflare, DNS-only) must resolve
# publicly BEFORE the first apply: Traefik tries a certificate once and doesn't retry a
# failed one on its own.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paypal-web
  labels:
    app.kubernetes.io/name: ambree-paypal
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
spec:
  ingressClassName: traefik
  rules:
    - host: paypal.ambree.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paypal-web
                port:
                  name: http
