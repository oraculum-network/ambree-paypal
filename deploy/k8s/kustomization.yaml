# paypal.ambree.ai on a single-node k3s cluster. Rendered with `kubectl kustomize deploy/k8s`.
# Prerequisites, made by the cluster admin, not from here: namespace `paypal`, PVC `paypal-data`,
# PriorityClass `paypal-low`, Secret `paypal-secrets` (and any quota, LimitRange or NetworkPolicies);
# see DEPLOY.md. This renders no Secret and no PVC.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paypal
labels:
  - pairs:
      app.kubernetes.io/part-of: ambree-paypal
      app.kubernetes.io/managed-by: oraculum-deploy
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# The image is oraculum/ambree-paypal:<sha7>. The deploy renders this dir through an overlay that
# sets newTag to that sha (DEPLOY.md step 5); `set-by-deploy` as it stands would fail with
# ErrImageNeverPull, never run a stale image.
images:
  - name: oraculum/ambree-paypal
    newTag: set-by-deploy
